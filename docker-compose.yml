services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payment_system_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payment_system_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_HOST: db
    volumes:
      - ./docker/sql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/sql/run-init.sh:/run-init.sh:ro
    entrypoint: ["/bin/bash", "/run-init.sh"]

  payment:
    build:
      context: .
      dockerfile: src/PaymentSystem.Payment/Dockerfile
    container_name: payment_system_payment
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ConnectionStrings__PaymentSystem: "Server=db,1433;Database=PaymentSystem;User Id=sa;TrustServerCertificate=True"
    ports:
      - "5002:8080"                               # CRUD endpoint'leri: http://localhost:5002/api/...
    restart: unless-stopped

  gate:
    build:
      context: .                                  # repo kökü: Gate src/PaymentSystem.Iso8583'e de ihtiyaç duyar
      dockerfile: src/PaymentSystem.Gate/Dockerfile
    container_name: payment_system_gate
    environment:
      Gate__Port: "8583"
      # Payment'ta henüz /api/transactions yok (sadece CRUD var), bu yüzden her finansal istek F39=91 ile cevaplanır.
      Gate__PaymentBaseUrl: "http://payment:8080"
    ports:
      - "8583:8583"
    restart: unless-stopped

volumes:
  mssql_data:
    name: payment_system_mssql_data
