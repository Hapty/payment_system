name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Coverage gate settings (80% line, Program.cs excluded) live in the test csproj.
      # The step fails if line coverage drops below the threshold.
      - name: Test with coverage gate
        run: dotnet test -c Release --no-build -p:CollectCoverage=true

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: tests/**/TestResults/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
